<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="臺大天文社官方網站，提供最新消息、社團介紹、活動行事曆、社團歷史和成果紀錄">

    <meta name="robots" content="noindex"> <!-- 3/5 發布時刪除這行 -->

    <title>臺大天文社 NTU Astronomy Club：{{ .Title }}</title>
    
    <link rel="icon" href="{{ "images/favicon.ico" | relURL }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/calendar.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/content.css" | relURL }}">

    <!-- Open Graph -->
    <meta property="og:title" content="臺大天文社 NTU Astronomy Club：{{ .Title }}">

    <header>
        {{ partial "header.html" . }}
    </header>

    </main>

        {{ partial "footer.html" . }}
    </footer>
