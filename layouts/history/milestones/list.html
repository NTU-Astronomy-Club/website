{{ define "main" }}
<section class="history">
    <aside class="sidebar">
        <h2 class="sidebar-title">往昔星辰</h2>

        <ul class="sidebar-nav">
            <li><a href="/history/origin/">建站緣起</a></li>
            <li><a href="/history/milestones">大事記</a></li>
            <li><a href="/history/journals/">社刊</a></li>
            <li><a href="/history/awards/">獲獎紀錄</a></li>
            <li><a href="/history/memories/">幹部回憶錄</a></li>
        </ul>
    </aside>
    
    <main class="history-content">
        
        <article class="content">
            <h1>{{ .Title }}</h1>
            {{ .Content }}
        </article>

        
        <section class="milestone-year">
            {{ range .Pages.ByDate }}
            <article class="content">
                <h3>{{ .Title }}</h3>
                {{ .Content }}
            </article>
            {{ end }}
        </section>
    </main>
</section>
{{ end }}
